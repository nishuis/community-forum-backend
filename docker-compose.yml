services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community-forum-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=forum_user
      - DB_PASSWORD=forum_password
      - DB_NAME=community_forum
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_ACCESS_EXP_HOUR=24
      - JWT_REFRESH_EXP_DAY=7
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/posts/search"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - forum-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: community-forum-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: forum_user
      MYSQL_PASSWORD: forum_password
      MYSQL_DATABASE: community_forum
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "forum_user", "-pforum_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: community-forum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - forum-network
    restart: unless-stopped

networks:
  forum-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
